<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medico Connect - Availability</title>

    <link rel="stylesheet" href="availability.css">

</head>

<body>

    <!-- Header -->

    <header class="header">

        <div class="logo">
            MEDICO CONNECT
        </div>

        <a href="doctor_dashboard.html" class="back-btn">
            ← Dashboard
        </a>

    </header>


    <!-- Main Content -->

    <main class="availability-container">

        <h1>Doctor Availability</h1>

        <p class="subtitle">
            Set your available consultation days and timings
        </p>


        <!-- Add Availability -->

        <section class="availability-card">

            <h2 id="formTitle">Add Availability</h2>

            <div class="form-group">

                <label>Select Day</label>

                <select id="day">

                    <option value="">Select Day</option>

                    <option>Monday</option>
                    <option>Tuesday</option>
                    <option>Wednesday</option>
                    <option>Thursday</option>
                    <option>Friday</option>
                    <option>Saturday</option>
                    <option>Sunday</option>

                </select>

            </div>


            <div class="time-row">

                <div class="form-group">

                    <label>Start Time</label>

                    <input type="time" id="startTime">

                </div>


                <div class="form-group">

                    <label>End Time</label>

                    <input type="time" id="endTime">

                </div>

            </div>


            <div class="form-group">

                <label>Status</label>

                <select id="status">

                    <option value="Available">
                        Available
                    </option>

                    <option value="Not Available">
                        Not Available
                    </option>

                </select>

            </div>


            <button id="saveButton" onclick="saveAvailability()">
                Add Availability
            </button>

            <button
                id="cancelButton"
                class="cancel-btn"
                onclick="cancelEdit()"
                style="display: none;">
                Cancel
            </button>

        </section>


        <!-- Availability List -->

        <section class="current-card">

            <h2>My Available Consultation Slots</h2>

            <div id="availabilityList">

                <!-- Availability will appear here -->

            </div>

        </section>

    </main>


    <script src="availability.js"></script>

</body>
</html>
