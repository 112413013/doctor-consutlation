```html
<!DOCTYPE html>
<html>

<head>
    <title>Doctor Registration</title>
    <link rel="stylesheet" href="doctor-style.css">
</head>

<body>

<div class="doctor-container">

    <h1>Doctor Registration</h1>
    <p class="subtitle">Create your doctor account</p>

    <!-- PHP ready form -->
    <form id="doctorForm" method="POST" action="doctor-registration.php">

        <label>Doctor Name</label>
        <input type="text" name="doctorName" id="doctorName"
               placeholder="Enter doctor name">

        <label>Email</label>
        <input type="text" name="doctorEmail" id="doctorEmail"
               placeholder="Enter email">

        <label>Phone Number</label>
        <input type="text" name="doctorPhone" id="doctorPhone"
               placeholder="Enter phone number">

        <label>Gender</label>
        <div class="gender">
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
        </div>

        <label>Specialization</label>
        <select name="specialization" id="specialization">

            <option value="">Select Specialization</option>
            <option value="General Medicine">General Medicine</option>
            <option value="Gynecology">Gynecology</option>
            <option value="Cardiology">Cardiology</option>
            <option value="Dermatology">Dermatology</option>
            <option value="Pediatrics">Pediatrics</option>
            <option value="Neurology">Neurology</option>
            <option value="Orthopedics">Orthopedics</option>
            <option value="ENT">ENT</option>
            <option value="Ophthalmology">Ophthalmology</option>
            <option value="Psychiatry">Psychiatry</option>
            <option value="Pulmonology">Pulmonology</option>
            <option value="Gastroenterology">Gastroenterology</option>

        </select>

        <label>Qualification</label>
        <input type="text" name="qualification" id="qualification"
               placeholder="Example: MBBS, MD">

        <label>Medical Registration Number</label>
        <input type="text" name="registrationNumber"
               id="registrationNumber"
               placeholder="Enter registration number">

        <label>Years of Experience</label>
        <input type="number" name="experience" id="experience"
               placeholder="Enter years of experience">

        <label>Hospital / Clinic Name</label>
        <input type="text" name="hospital" id="hospital"
               placeholder="Enter hospital or clinic name">

        <label>Available Days</label>

        <div class="days">

            <input type="checkbox" name="availableDays[]" value="Monday">
            Monday

            <input type="checkbox" name="availableDays[]" value="Tuesday">
            Tuesday

            <input type="checkbox" name="availableDays[]" value="Wednesday">
            Wednesday

            <input type="checkbox" name="availableDays[]" value="Thursday">
            Thursday

            <input type="checkbox" name="availableDays[]" value="Friday">
            Friday

            <input type="checkbox" name="availableDays[]" value="Saturday">
            Saturday

        </div>

        <label>Available Time</label>
        <input type="time" name="availableTime" id="availableTime">

        <label>Password</label>
        <input type="password" name="doctorPassword"
               id="doctorPassword"
               placeholder="Enter password">

        <label>Confirm Password</label>
        <input type="password" name="confirmDoctorPassword"
               id="confirmDoctorPassword"
               placeholder="Confirm password">

        <button type="submit">Register</button>

    </form>

</div>

<script src="doctor-validation.js"></script>

</body>
</html>
```
