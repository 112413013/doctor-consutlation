<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medico Connect - Doctor Profile</title>

    <link rel="stylesheet" href="doctor_profile.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">
            <span>MEDICO</span> CONNECT
        </div>

        <a href="doctor_dashboard.html" class="back-btn">
            ← Dashboard
        </a>

    </header>


    <!-- Profile Section -->
    <main class="profile-container">

        <h1>My Profile</h1>
        <p class="subtitle">View and manage your professional information</p>


        <section class="profile-card">

            <!-- Doctor Information -->
            <div class="profile-top">

                <div class="doctor-icon">
                    👨‍⚕️
                </div>

                <div>
                    <h2 id="displayName">Dr. John Smith</h2>
                    <p id="displaySpecialization">Cardiologist</p>
                </div>

            </div>


            <!-- Profile Details -->
            <div class="profile-details">

                <div class="detail-box">
                    <label>Doctor Name</label>
                    <p id="nameText">Dr. John Smith</p>
                </div>

                <div class="detail-box">
                    <label>Specialization</label>
                    <p id="specializationText">Cardiologist</p>
                </div>

                <div class="detail-box">
                    <label>Email</label>
                    <p id="emailText">doctor@example.com</p>
                </div>

                <div class="detail-box">
                    <label>Phone Number</label>
                    <p id="phoneText">9876543210</p>
                </div>

                <div class="detail-box">
                    <label>Experience</label>
                    <p id="experienceText">8 Years</p>
                </div>

                <div class="detail-box">
                    <label>Consultation Fee</label>
                    <p id="feeText">₹800</p>
                </div>

            </div>


            <!-- Edit Form -->
            <div class="edit-form" id="editForm">

                <h2>Edit Profile</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label>Doctor Name</label>
                        <input type="text" id="nameInput" value="Dr. John Smith">
                    </div>

                    <div class="form-group">
                        <label>Specialization</label>
                        <input type="text" id="specializationInput" value="Cardiologist">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="emailInput" value="doctor@example.com">
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" id="phoneInput" value="9876543210">
                    </div>

                    <div class="form-group">
                        <label>Experience</label>
                        <input type="text" id="experienceInput" value="8 Years">
                    </div>

                    <div class="form-group">
                        <label>Consultation Fee</label>
                        <input type="text" id="feeInput" value="₹800">
                    </div>

                </div>

                <div class="form-buttons">
                    <button class="save-btn" onclick="saveProfile()">
                        Save Changes
                    </button>

                    <button class="cancel-btn" onclick="cancelEdit()">
                        Cancel
                    </button>
                </div>

            </div>


            <!-- Action Button -->
            <div class="profile-actions" id="profileActions">

                <button onclick="editProfile()">
                    Edit Profile
                </button>

            </div>

        </section>

    </main>


    <script src="doctor_profile.js"></script>

</body>
</html>
